<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello! Chris Lee</title>
    <link rel="icon" href="/frozenlemon/assets/%E9%95%9C%E5%AD%90%E5%9C%86-DTydmDLn.webp" type="image/webp" />
  </head>
  <body>
    <script>
      (async function () {
        const response = await fetch("../Hello-ChrisLee.html");
        let html = await response.text();
        html = html
          .replaceAll("../styles/", "../../styles/")
          .replaceAll("../image/", "../../image/")
          .replaceAll("../scripts/", "../../scripts/")
          .replaceAll("../components/", "../../components/");
        document.open();
        document.write(html);
        document.close();
      })();
    </script>
  </body>
</html>
